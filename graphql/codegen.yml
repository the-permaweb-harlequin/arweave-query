schema: './graphql/schema.graphql'
documents: './graphql/queries/**/*.graphql'
generates:
  # Core types (no React dependencies)
  ./packages/core/src/generated/graphql.ts:
    plugins:
      - 'typescript'
      - 'typescript-operations'
      - 'typescript-graphql-request'
    config:
      skipTypename: true
      withHooks: false
      scalars:
        ID: string
        String: string
        Int: number
        Boolean: boolean

  # React hooks (depends on core)
  ./packages/frameworks/react/src/generated/hooks.tsx:
    plugins:
      - 'typescript'
      - 'typescript-operations'
      - 'typescript-react-query'
    config:
      withHooks: true
      withComponent: false
      withHOC: false
      reactQueryVersion: 5
      fetcher:
        func: './fetcher#fetcher'
        isReactHook: false
